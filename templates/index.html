<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юридический ассистент ПСБ</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Юридический ассистент ПСБ</h1>
        </header>
        <main class="chat-area">
            <div id="messages" class="messages">
                <div class="msg bot">
                    <div class="bubble">Здравствуйте. Я помогу найти информацию в нормативных документах банка ПСБ. Задайте ваш вопрос.</div>
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" placeholder="Введите вопрос..." rows="2"></textarea>
                <button id="send">Отправить</button>
            </div>
        </main>
        <aside id="sources" class="sources hidden">
            <h3>Источники</h3>
            <div id="sources-list"></div>
        </aside>
    </div>
    <div id="status-bar" class="status-bar"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
